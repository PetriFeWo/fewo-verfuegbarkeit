<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verfügbarkeit Ferienwohnung</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
<style>
  :root {
    --bg-a: #EAF4F1;
    --bg-b: #F5EDE4;
    --card: #FFFFFF;
    --border: #E3E9E6;
    --text: #3A4A47;
    --text-dim: #8A9B96;
    --accent: #4F8A7C;
    --free-bg: #DFF3E8;
    --free-text: #3E8065;
    --free-border: #BFE6D3;
    --booked-bg: #F6E4E4;
    --booked-text: #B48787;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 {
    font-size: 1.9rem;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--text);
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 1.05rem;
    margin: 0 0 26px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 28px;
    box-shadow: 0 16px 40px rgba(79, 138, 124, 0.14);
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .nav button {
    background: var(--bg-a);
    border: none;
    color: var(--accent);
    border-radius: 12px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 1.3rem;
    line-height: 1;
    transition: background 0.15s ease;
  }
  .nav button:hover { background: var(--free-bg); }
  .month-label { font-weight: 700; color: var(--text); font-size: 1.2rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
  }
  .weekday {
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-dim);
    padding-bottom: 6px;
    font-weight: 600;
  }
  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    font-size: 1.05rem;
    font-weight: 500;
  }
  .day.empty { visibility: hidden; }
  .day.free { background: var(--free-bg); color: var(--free-text); border: 1px solid var(--free-border); }
  .day.booked { background: var(--booked-bg); color: var(--booked-text); }
  .legend {
    display: flex;
    gap: 22px;
    margin-top: 24px;
    font-size: 0.95rem;
    color: var(--text-dim);
  }
  .legend span { display: flex; align-items: center; gap: 8px; }
  .dot { width: 13px; height: 13px; border-radius: 5px; display: inline-block; }
  .dot.free { background: var(--free-bg); border: 1px solid var(--free-border); }
  .dot.booked { background: var(--booked-bg); }
  .status {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Verfügbarkeit</h1>
  <p class="subtitle">Freie und belegte Zeiträume unserer Ferienwohnung</p>
  <div class="card">
    <div class="nav">
      <button id="prevBtn" aria-label="Vorheriger Monat">‹</button>
      <div class="month-label" id="monthLabel">–</div>
      <button id="nextBtn" aria-label="Nächster Monat">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><span class="dot free"></span> frei</span>
      <span><span class="dot booked"></span> belegt</span>
    </div>
  </div>
  <p class="status" id="statusLine">Lade Verfügbarkeit …</p>
</div>

<script>
// Passe diese URL an: Pfad zur .ics-Datei im selben Repo (relativ) oder volle URL
const ICS_URL = "./verfuegbarkeit.ics";

const weekdayNames = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const monthNames = [
  "Januar", "Februar", "März", "April", "Mai", "Juni",
  "Juli", "August", "September", "Oktober", "November", "Dezember"
];

let bookedRanges = []; // Array von {start: Date, end: Date} - end exklusiv
let currentMonth = new Date();
currentMonth.setDate(1);

async function loadAvailability() {
  const statusLine = document.getElementById("statusLine");
  try {
    const res = await fetch(ICS_URL + "?t=" + Date.now()); // Cache-Busting
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();

    const jcalData = ICAL.parse(text);
    const comp = new ICAL.Component(jcalData);
    const events = comp.getAllSubcomponents("vevent");

    bookedRanges = events.map(ev => {
      const icalEvent = new ICAL.Event(ev);
      return {
        start: icalEvent.startDate.toJSDate(),
        end: icalEvent.endDate.toJSDate(),
      };
    });

    statusLine.textContent = "Stand: " + new Date().toLocaleString("de-DE");
    renderMonth();
  } catch (err) {
    console.error(err);
    statusLine.textContent = "Verfügbarkeit konnte nicht geladen werden.";
  }
}

function isBooked(date) {
  return bookedRanges.some(r => date >= stripTime(r.start) && date < stripTime(r.end));
}

function stripTime(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function renderMonth() {
  const grid = document.getElementById("grid");
  const monthLabel = document.getElementById("monthLabel");
  grid.innerHTML = "";

  monthLabel.textContent = monthNames[currentMonth.getMonth()] + " " + currentMonth.getFullYear();

  weekdayNames.forEach(w => {
    const el = document.createElement("div");
    el.className = "weekday";
    el.textContent = w;
    grid.appendChild(el);
  });

  const firstOfMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // Montag = 0
  const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();

  for (let i = 0; i < startOffset; i++) {
    const el = document.createElement("div");
    el.className = "day empty";
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), d);
    const el = document.createElement("div");
    el.className = "day " + (isBooked(date) ? "booked" : "free");
    el.textContent = d;
    grid.appendChild(el);
  }
}

document.getElementById("prevBtn").addEventListener("click", () => {
  currentMonth.setMonth(currentMonth.getMonth() - 1);
  renderMonth();
});
document.getElementById("nextBtn").addEventListener("click", () => {
  currentMonth.setMonth(currentMonth.getMonth() + 1);
  renderMonth();
});

loadAvailability();
</script>
</body>
</html>

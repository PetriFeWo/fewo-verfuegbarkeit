<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verfügbarkeit Ferienwohnung</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --bg-card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #6366f1;
    --free: #14b8a6;
    --booked: #475569;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin: 0 0 20px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .nav button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 1rem;
  }
  .nav button:hover { border-color: var(--accent); }
  .month-label { font-weight: 600; }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .weekday {
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-dim);
    padding-bottom: 4px;
  }
  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 0.8rem;
  }
  .day.empty { visibility: hidden; }
  .day.free { background: rgba(20, 184, 166, 0.15); color: var(--free); border: 1px solid rgba(20, 184, 166, 0.3); }
  .day.booked { background: var(--booked); color: var(--text-dim); }
  .legend {
    display: flex;
    gap: 16px;
    margin-top: 16px;
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .dot.free { background: var(--free); }
  .dot.booked { background: var(--booked); }
  .status {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Verfügbarkeit</h1>
  <p class="subtitle">Freie und belegte Zeiträume unserer Ferienwohnung</p>
  <div class="card">
    <div class="nav">
      <button id="prevBtn" aria-label="Vorheriger Monat">‹</button>
      <div class="month-label" id="monthLabel">–</div>
      <button id="nextBtn" aria-label="Nächster Monat">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><span class="dot free"></span> frei</span>
      <span><span class="dot booked"></span> belegt</span>
    </div>
  </div>
  <p class="status" id="statusLine">Lade Verfügbarkeit …</p>
</div>

<script>
// Passe diese URL an: Pfad zur .ics-Datei im selben Repo (relativ) oder volle URL
const ICS_URL = "./verfuegbarkeit.ics";

const weekdayNames = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const monthNames = [
  "Januar", "Februar", "März", "April", "Mai", "Juni",
  "Juli", "August", "September", "Oktober", "November", "Dezember"
];

let bookedRanges = []; // Array von {start: Date, end: Date} - end exklusiv
let currentMonth = new Date();
currentMonth.setDate(1);

async function loadAvailability() {
  const statusLine = document.getElementById("statusLine");
  try {
    const res = await fetch(ICS_URL + "?t=" + Date.now()); // Cache-Busting
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();

    const jcalData = ICAL.parse(text);
    const comp = new ICAL.Component(jcalData);
    const events = comp.getAllSubcomponents("vevent");

    bookedRanges = events.map(ev => {
      const icalEvent = new ICAL.Event(ev);
      return {
        start: icalEvent.startDate.toJSDate(),
        end: icalEvent.endDate.toJSDate(),
      };
    });

    statusLine.textContent = "Stand: " + new Date().toLocaleString("de-DE");
    renderMonth();
  } catch (err) {
    console.error(err);
    statusLine.textContent = "Verfügbarkeit konnte nicht geladen werden.";
  }
}

function isBooked(date) {
  return bookedRanges.some(r => date >= stripTime(r.start) && date < stripTime(r.end));
}

function stripTime(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function renderMonth() {
  const grid = document.getElementById("grid");
  const monthLabel = document.getElementById("monthLabel");
  grid.innerHTML = "";

  monthLabel.textContent = monthNames[currentMonth.getMonth()] + " " + currentMonth.getFullYear();

  weekdayNames.forEach(w => {
    const el = document.createElement("div");
    el.className = "weekday";
    el.textContent = w;
    grid.appendChild(el);
  });

  const firstOfMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // Montag = 0
  const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();

  for (let i = 0; i < startOffset; i++) {
    const el = document.createElement("div");
    el.className = "day empty";
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), d);
    const el = document.createElement("div");
    el.className = "day " + (isBooked(date) ? "booked" : "free");
    el.textContent = d;
    grid.appendChild(el);
  }
}

document.getElementById("prevBtn").addEventListener("click", () => {
  currentMonth.setMonth(currentMonth.getMonth() - 1);
  renderMonth();
});
document.getElementById("nextBtn").addEventListener("click", () => {
  currentMonth.setMonth(currentMonth.getMonth() + 1);
  renderMonth();
});

loadAvailability();
</script>
</body>
</html>
